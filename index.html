<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mon App</title>

  <!-- Ce fichier dit au téléphone "cette app peut être installée" -->
  <link rel="manifest" href="manifest.json" />

  <!-- Icône affichée dans l'onglet du navigateur -->
  <link rel="icon" href="icons/icon-192.png" />
  <!-- Icône utilisée par iOS quand on ajoute l'app à l'écran d'accueil -->
  <link rel="apple-touch-icon" href="icons/icon-192.png" />

  <!-- Couleur de la barre en haut de l'écran quand l'app est installée -->
  <meta name="theme-color" content="#2563eb" />

  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <main class="container">
    <h1>👋 Mon App</h1>
    <p>Choisis un sujet pour accéder à tes notes.</p>

    <nav class="subject-grid">
      <a class="subject-card" href="pages/maths.html" data-available="false">
        <span class="subject-icon">📐</span>
        <span class="subject-name">Maths</span>
        <span class="subject-badge">Bientôt</span>
      </a>
      <a class="subject-card" href="pages/physique.html" data-available="false">
        <span class="subject-icon">⚛️</span>
        <span class="subject-name">Physique</span>
        <span class="subject-badge">Bientôt</span>
      </a>
      <a class="subject-card" href="pages/chimie.html" data-available="false">
        <span class="subject-icon">🧪</span>
        <span class="subject-name">Chimie</span>
        <span class="subject-badge">Bientôt</span>
      </a>
      <a class="subject-card" href="pages/informatique.html" data-available="false">
        <span class="subject-icon">💻</span>
        <span class="subject-name">Informatique</span>
        <span class="subject-badge">Bientôt</span>
      </a>
      <a class="subject-card" href="pages/japonais.html" data-available="true">
        <span class="subject-icon">🇯🇵</span>
        <span class="subject-name">Japonais</span>
      </a>
      <a class="subject-card" href="pages/allemand.html" data-available="true">
        <span class="subject-icon">🇩🇪</span>
        <span class="subject-name">Allemand</span>
      </a>
    </nav>

    <p class="status" id="status"></p>
  </main>

  <script src="js/app.js"></script>
</body>
</html>
