<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mon App</title>

  <!-- Ce fichier dit au téléphone "cette app peut être installée" -->
  <link rel="manifest" href="manifest.json" />

  <!-- Icône affichée dans l'onglet du navigateur -->
  <link rel="icon" href="icons/icon-192.png" />
  <!-- Icône utilisée par iOS quand on ajoute l'app à l'écran d'accueil -->
  <link rel="apple-touch-icon" href="icons/icon-192.png" />

  <!-- Couleur de la barre en haut de l'écran quand l'app est installée -->
  <meta name="theme-color" content="#2563eb" />

  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <main class="container">
    <h1>👋 Mon App</h1>
    <p>Ceci est le point de départ de ton app. Modifie ce fichier, pousse tes changements, et ils apparaîtront sur ton téléphone.</p>

    <button id="counter-btn">Cliqué 0 fois</button>

    <p class="status" id="status"></p>
  </main>

  <script src="js/app.js"></script>
</body>
</html>
